# GitHub pull requests — connector definition.
#
# Onboarding a connector is ONE file like this plus one adapter class (take-home
# line 29: admins onboard "via console or config"). This file is loaded verbatim
# into `connectors(connector_type, version, capabilities JSONB)` by
# `scripts/seed.py`; nothing here is duplicated in Python.
#
# A capability is (predicate support) + (where the value is injected) — the
# airbyte-cdk RequestOption pattern, research Card 2. Knowing that GitHub can
# filter on `state` is useless without knowing it goes in the query string while
# `repo` goes in the URL path.

connector_type: github
version: "1.0.0"
resource: pull_requests

capabilities:
  columns:
    - number
    - title
    - author
    - repo
    - state
    - issue_key
    - created_at
    - updated_at

  # Only non-string columns need declaring; everything else defaults to string.
  # Phase 2 needs a type BEFORE it has a row to look at: the Arrow schema handed
  # to duckdb.register must be explicit (an empty result infers zero columns and
  # DuckDB refuses to register it), and QueryEnvelope.columns[].type is part of
  # the response contract.
  column_types:
    number: integer

  key_columns:
    # REQUIRED, and injected into the path: there is no GitHub endpoint that
    # lists pull requests across every repository, so a fetch without `repo`
    # has no URL to call at all. This is `require: required` earning its keep.
    repo:
      require: required
      ops: ["="]
      option: {inject_into: path, field: repo}

    state:
      require: optional
      ops: ["="]
      option: {inject_into: query, field: state}

    author:
      require: optional
      ops: ["="]
      option: {inject_into: query, field: author}

  sortable:
    - created_at
    - updated_at

  # Cursor pagination — what a real GitHub client reads out of the Link header.
  # The strategy computes the token; `token_option` says where it is injected.
  pagination:
    strategy: cursor
    page_size: 100
    token_option: {inject_into: query, field: cursor}
    stop: returned<page_size
