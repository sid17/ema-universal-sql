# Three services, deliberately: app, postgres, redis.
#
# ADR-016 — no Jaeger and no OTLP collector. The trace requirement is met with an
# in-process exporter and a rendered waterfall, so a fourth container would only
# cost cold-start time against the "healthy in under 60s" submission gate.
#
# `app` waits on both backing services being *healthy*, not merely started, so
# `make up` cannot race the database on a cold machine.

services:
  app:
    build: .
    image: universal-sql-app
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-signing-key-not-for-production}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ema-universal-sql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/universal_sql}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      CONTROL_PLANE_TTL_MS: ${CONTROL_PLANE_TTL_MS:-30000}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-300000}
      TEST_MODE: ${TEST_MODE:-0}
      DEFAULT_SCOPES: ${DEFAULT_SCOPES:-query:execute}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ON here, OFF by default in src/config.py (ADR-038). The mocks answer in
      # ~2ms, and a trace where both sources are free and DuckDB is the cost is
      # the inverse of how a federated query really behaves — so the running
      # stack simulates the round trip HLD line 39 says these mocks simulate.
      # Applied on the live path only, so a cache hit is still ~0.4ms and the
      # k6 run still measures the engine.
      MOCK_LATENCY_SCALE: ${MOCK_LATENCY_SCALE:-1.0}
      # Must be passed through, or `OTEL_EXPORTER=none make load` in Phase 4
      # silently keeps exporting and distorts the very latency k6 measures.
      OTEL_EXPORTER: ${OTEL_EXPORTER:-file}
      OTEL_TRACE_FILE: ${OTEL_TRACE_FILE:-traces/spans.jsonl}
    # ADR-016 keeps tracing backend-free, so the JSONL span log *is* the
    # artifact. Bind-mounted rather than left in the container so Phase 4 can
    # render the waterfall from the host after `make down`.
    volumes:
      - ./traces:/app/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The image is python:3.11-slim and carries no curl; urllib keeps it slim.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz").read()
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # k6 lives behind `profiles:`, so it NEVER starts with `make up` and costs
  # nothing against the sub-60s cold-start gate — `docker compose up` ignores a
  # profiled service entirely. It joins the compose network and reaches the app
  # at `http://app:8000`, deliberately NOT `host.docker.internal`, which is a
  # Docker-Desktop-ism that does not exist on plain Linux (ADR-044).
  #
  # Running it from its own container is what lets `make load` work on a fresh
  # clone with no k6 installed — the sub-60s quickstart claim depends on the
  # reviewer never having to install anything.
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    environment:
      BASE_URL: http://app:8000
      RATE: ${RATE:-500}
      DURATION: ${DURATION:-60s}
    volumes:
      - ./load:/load:ro
      # handleSummary writes docs/k6-summary.txt through this mount, rather than
      # the run's stdout being redirected: stdout carries the live progress bar
      # and ANSI escapes, which do not belong in a submission artifact.
      - ./docs:/artifacts
    entrypoint: ["k6", "run", "/load/query_load.js"]
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: universal_sql
    # Published on 55432, NOT 5432. Phase 0 published no port at all, on the
    # grounds that a developer machine very often already has something on
    # 5432 — which an unusual port avoids while still letting host-side
    # integration tests assert what is actually IN the control plane. `app`
    # still reaches Postgres over the compose network on 5432; this mapping
    # exists for `make test-integration` and for
    # `psql -h localhost -p 55432 -U postgres universal_sql`.
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d universal_sql"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  redis:
    image: redis:7
    # Same reasoning as postgres: unpublished, reached over the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

volumes:
  postgres_data:
